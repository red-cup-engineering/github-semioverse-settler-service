name: Native GitHub signal to Work feedback
on:
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/native-work-feedback.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-to-native-work:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22.18.0'
      - name: Receive the locked native suppliers without lifecycle effects
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check the real source-to-Work modules
        run: |
          node --check src/settler.mjs
          node --check src/native-work-receiving.mjs
          node --check src/github-envelope.mjs
          node --check src/github-cells.mjs
          node --check scripts/project-github-cells.mjs
          node --check test/settler.test.mjs
          node --check test/native-work-receiving.test.mjs
      - name: Execute original native Work signal, replay and receiving tests
        run: npm run verify
